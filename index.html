<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AR TATA SURYA</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden">
    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
        <a-assets>
            <audio id="sound" src="assets/sound_strom.mp3" preload="auto"></audio>
            <a-asset-item id="planetModel" src="assets/planet.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="custom" type="pattern" url="assets/pattern-AR.patt">
            <!-- Object 1: Matahari -->
            <a-entity id="sun" gltf-model="assets/sun.glb" scale="0.1 0.1 0.1" position="0 0 0"
                animation="property:rotation; from:0 0 0; to: 0 360 0; dur: 3000; loop:true">
                <a-sound src="assets/space-sound.mp3" autoplay="true" position="0 0 0"></a-sound>
            </a-entity>

            <!-- Object 2: Planet -->
            <a-entity id="planet-wrapper" position="0 0 0" animation="property:rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear">
                <a-entity gltf-model="#planetModel" scale="0.5 0.5 0.5" position="0.2 2 -0.8"></a-entity>
            </a-entity>
        </a-marker>

        <a-entity sound="src: #sound" autoplay="false"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
