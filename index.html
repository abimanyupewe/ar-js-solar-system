<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AR Solar System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <!-- A-Frame dan AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden">
  <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;' ;>
    <a-assets>
      <audio id="sound" src="generator/backsound/sound_strom.mp3" preload="auto"></audio>
    </a-assets>
    <a-marker preset="custom" type="pattern" url="generator/patter/pattern-marker.patt">
      <a-entity gltf-model="./assets/3d/solar_system.glb" scale="1 1 1" position="0.5 0 0"
        animation="property:rotation; from:0 0 0; to: 0 360 0; dur: 3000; loop:true">
        <a-sound src="generator/backsound/sound_strom.mp3" autoplay="true" position="0 0 0"></a-sound>
      </a-entity>
    </a-marker>More actions
    <a-entity sound="src: #sound" autoplay="false"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
